apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-scheduler
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpu-scheduler
  template:
    metadata:
      labels:
        app: cpu-scheduler
    spec:
      serviceAccountName: cpu-scheduler-sa
      containers:
        - name: kube-scheduler
          image: registry.k8s.io/kube-scheduler:v1.25.3
          command:
            - kube-scheduler
            - --config=/etc/kubernetes/cpu-scheduler-config.yaml
            - --leader-elect=false
          volumeMounts:
            - name: config-volume
              mountPath: /etc/kubernetes/cpu-scheduler-config.yaml
              subPath: cpu-scheduler-config.yaml

        # <-- debug sidecar, to give you a shell
        - name: debug-shell
          image: busybox:1.35    # any tiny image with /bin/sh
          command: ["sleep","infinity"]
          volumeMounts:
            - name: config-volume
              mountPath: /etc/kubernetes/cpu-scheduler-config.yaml
              subPath: cpu-scheduler-config.yaml

      volumes:
        - name: config-volume
          configMap:
            name: cpu-scheduler-config
            items:
              - key: cpu-scheduler-config.yaml
                path: cpu-scheduler-config.yaml
