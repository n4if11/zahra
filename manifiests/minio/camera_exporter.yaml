apiVersion: apps/v1
kind: Deployment
metadata:
  name: camera-exporter
  labels:
    app: camera-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: camera-exporter
  template:
    metadata:
      labels:
        app: camera-exporter
    spec:
      containers:
        - name: exporter
          image: <your-registry>/camera-exporter:latest
          args:
            - "/etc/urls/urls.txt"
          ports:
            - containerPort: 9110
              name: metrics
          resources:
            requests:
              cpu: 2
              memory: 4Gi
            limits:
              cpu: 4
              memory: 4Gi
          volumeMounts:
            - name: urls-volume
              mountPath: /etc/urls
              readOnly: true
      volumes:
        - name: urls-volume
          configMap:
            name: camera-urls
            items:
              - key: urls.txt
                path: urls.txt
