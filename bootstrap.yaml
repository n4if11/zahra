apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: autopilot-bootstrap
  name: autopilot-bootstrap
  namespace: argocd
spec:
  destination:
    namespace: argocd
    name: zahra-cluster
  project: default
  source:
    path: bootstrap
    repoURL: https://github.com/n4if11/zahra
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
    - allowEmpty=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: autopilot-bootstrap-prod
  name: autopilot-bootstrap-prod
  namespace: argocd
spec:
  destination:
    namespace: argocd
    name: prod-cluster
  project: default
  source:
    path: bootstrap
    repoURL: https://github.com/n4if11/zahra
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
    - allowEmpty=true
    - CreateNamespace=true
