apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
- name: argo-cd
  repo: https://argoproj.github.io/argo-helm
  releaseName: argocd
  namespace: argocd
  version: 8.1.2
  valuesFile: values.yaml

patches:
- patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: argocd-repo-server
    spec:
      template:
        spec:
          initContainers:
          - name: copyutil
            args: null
  target:
    kind: Deployment
    name: argocd-repo-server