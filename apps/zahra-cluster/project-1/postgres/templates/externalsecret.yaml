apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: postgres
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: postgres-credentials
    creationPolicy: Owner
  data:
    - secretKey: superuser
      remoteRef:
        key: project-1/postgres
        property: superuser
    - secretKey: superuserPassword
      remoteRef:
        key: project-1/postgres
        property: superuserPassword
    - secretKey: dbName
      remoteRef:
        key: project-1/postgres
        property: dbName
    - secretKey: dbUser
      remoteRef:
        key: project-1/postgres
        property: dbUser
    - secretKey: dbPassword
      remoteRef:
        key: project-1/postgres
        property: dbPassword
