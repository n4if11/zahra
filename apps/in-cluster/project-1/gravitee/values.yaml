apim:
  global:
    security:
      allowInsecureImages: true
  
  es:
    enabled: false
  
  elasticsearch:
    enabled: false
  
  jdbc:
    url: jdbc:postgresql://in-cluster-postgres.postgres.svc.cluster.local:5432/graviteeapim
    driver: https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar
    driverClassName: org.postgresql.Driver
    username: postgres 
    password: admin@123
  
  management:
    type: jdbc
  
  ratelimit:
    type: jdbc
  
  # API Component
  api:
    enabled: true
    
    # Fix: Remove duplicate MGMT_API_URL and use HTTP
    env:
      - name: gravitee_management_type
        value: jdbc
      - name: gravitee_ratelimit_type
        value: jdbc
      - name: gravitee_analytics_type
        value: none
      - name: gravitee_reporters_elasticsearch_enabled
        value: "false"
      - name: gravitee_analytics_elasticsearch_enabled
        value: "false"
      - name: gravitee_services_sync_enabled
        value: "false"
      - name: gravitee_management_jdbc_url
        value: jdbc:postgresql://in-cluster-postgres.postgres.svc.cluster.local:5432/graviteeapim
      - name: gravitee_management_jdbc_username
        value: postgres
      - name: gravitee_management_jdbc_password
        value: admin@123
      - name: gravitee_management_jdbc_liquibase_enabled
        value: "true"
      # Fix portal entrypoint to HTTP
      - name: portal.entrypoint
        value: http://gateway.zahra.local/
    
    gravitee:
      reporters:
        elasticsearch:
          enabled: false
      analytics:
        enabled: false
      management:
        type: jdbc
      services:
        sync:
          enabled: false
    
    # Fix: Remove bad rewrite rules
    ingress:
      management:
        enabled: true
        ingressClassName: nginx
        path: /management
        pathType: Prefix
        hosts:
          - api.zahra.local
        annotations:
          nginx.ingress.kubernetes.io/ssl-redirect: "false"
          # REMOVED bad rewrite-target
      
      portal:
        enabled: true
        ingressClassName: nginx
        path: /portal
        pathType: Prefix
        hosts:
          - api.zahra.local
        annotations:
          nginx.ingress.kubernetes.io/ssl-redirect: "false"
          # REMOVED bad rewrite-target
    
    readinessProbe:
      initialDelaySeconds: 60
      periodSeconds: 30
      failureThreshold: 3
    
    livenessProbe:
      initialDelaySeconds: 120
      periodSeconds: 30
      failureThreshold: 3
  
  # Gateway Component
  gateway:
    enabled: true
    
    env:
      - name: gravitee_management_type
        value: jdbc
      - name: gravitee_ratelimit_type
        value: jdbc
      - name: gravitee_reporters_elasticsearch_enabled
        value: "false"
      - name: gravitee_analytics_elasticsearch_enabled
        value: "false"
      - name: gravitee_management_jdbc_url
        value: jdbc:postgresql://in-cluster-postgres.postgres.svc.cluster.local:5432/graviteeapim
      - name: gravitee_management_jdbc_username
        value: postgres
      - name: gravitee_management_jdbc_password
        value: admin@123
      - name: gravitee_management_jdbc_liquibase_enabled
        value: "true"
      - name: gravitee_ratelimit_jdbc_url
        value: jdbc:postgresql://in-cluster-postgres.postgres.svc.cluster.local:5432/graviteeapim
      - name: gravitee_ratelimit_jdbc_username
        value: postgres
      - name: gravitee_ratelimit_jdbc_password
        value: admin@123
      - name: gravitee_ratelimit_jdbc_liquibase_enabled
        value: "true"
    
    gravitee:
      reporters:
        elasticsearch:
          enabled: false
      analytics:
        enabled: false
      management:
        type: jdbc
      ratelimit:
        type: jdbc
    
    ingress:
      enabled: true
      ingressClassName: nginx
      path: /
      pathType: Prefix
      hosts:
        - gateway.zahra.local
      annotations:
        nginx.ingress.kubernetes.io/ssl-redirect: "false"
    
    readinessProbe:
      initialDelaySeconds: 60
      periodSeconds: 30
      failureThreshold: 3
    
    livenessProbe:
      initialDelaySeconds: 120
      periodSeconds: 30
      failureThreshold: 3

  # UI Component - Fix URLs to use HTTP
  ui:
    enabled: true
    
    # Fix: Use HTTP instead of HTTPS
    env:
      - name: MGMT_API_URL
        value: http://api.zahra.local/management
    
    ingress:
      enabled: true
      ingressClassName: nginx
      path: /
      pathType: Prefix
      hosts:
        - console.zahra.local
      annotations:
        nginx.ingress.kubernetes.io/ssl-redirect: "false"
        # REMOVED bad rewrite-target

  # Portal Component - Fix URLs to use HTTP
  portal:
    enabled: true
    
    # Fix: Use HTTP instead of HTTPS
    env:
      - name: PORTAL_API_URL
        value: http://api.zahra.local/portal
    
    ingress:
      enabled: true
      ingressClassName: nginx
      path: /
      pathType: Prefix
      hosts:
        - portal.zahra.local
      annotations:
        nginx.ingress.kubernetes.io/ssl-redirect: "false"
        # REMOVED bad rewrite-target