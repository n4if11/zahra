apim:
  # Global Elasticsearch disable
  es:
    enabled: false
  
  elasticsearch:
    enabled: false
  
  # JDBC Configuration (global level)
  jdbc:
    url: jdbc:postgresql://in-cluster-postgres.postgres.svc.cluster.local:5432/graviteeapim
    driver: https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar
    driverClassName: org.postgresql.Driver
    username: postgres 
    password: admin@123
  
  # Management & Rate Limit repositories
  management:
    type: jdbc
  
  ratelimit:
    type: jdbc
  
  # API Component Configuration
  api:
    enabled: true
    
    # Environment variables to override ES configuration
    env:
      - name: gravitee_management_type
        value: jdbc
      - name: gravitee_ratelimit_type
        value: jdbc
      - name: gravitee_reporters_elasticsearch_enabled
        value: "false"
      - name: gravitee_analytics_elasticsearch_enabled
        value: "false"
      - name: gravitee_services_sync_enabled
        value: "false"
      # Explicitly set JDBC properties
      - name: gravitee_management_jdbc_url
        value: jdbc:postgresql://in-cluster-postgres.postgres.svc.cluster.local:5432/graviteeapim
      - name: gravitee_management_jdbc_username
        value: postgres
      - name: gravitee_management_jdbc_password
        value: admin@123
    
    gravitee:
      # Disable all ES reporters
      reporters:
        elasticsearch:
          enabled: false
      
      # Disable analytics
      analytics:
        enabled: false
      
      # Force management repository to JDBC
      management:
        type: jdbc
      
      # Explicitly disable ES as a service
      services:
        sync:
          enabled: false
    
    # API-specific JDBC config
    jdbc:
      url: jdbc:postgresql://in-cluster-postgres.postgres.svc.cluster.local:5432/graviteeapim
      driver: https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar
      driverClassName: org.postgresql.Driver
      username: postgres 
      password: admin@123
    
    # Increase delays for initialization
    readinessProbe:
      initialDelaySeconds: 90
      periodSeconds: 30
    
    livenessProbe:
      initialDelaySeconds: 150
      periodSeconds: 30
  
  # Gateway Component Configuration
  gateway:
    enabled: true
    
    # Environment variables to override ES configuration
    env:
      - name: gravitee_management_type
        value: jdbc
      - name: gravitee_ratelimit_type
        value: jdbc
      - name: gravitee_reporters_elasticsearch_enabled
        value: "false"
      - name: gravitee_analytics_elasticsearch_enabled
        value: "false"
      # Explicitly set JDBC properties
      - name: gravitee_management_jdbc_url
        value: jdbc:postgresql://in-cluster-postgres.postgres.svc.cluster.local:5432/graviteeapim
      - name: gravitee_management_jdbc_username
        value: postgres
      - name: gravitee_management_jdbc_password
        value: admin@123
      - name: gravitee_ratelimit_jdbc_url
        value: jdbc:postgresql://in-cluster-postgres.postgres.svc.cluster.local:5432/graviteeapim
      - name: gravitee_ratelimit_jdbc_username
        value: postgres
      - name: gravitee_ratelimit_jdbc_password
        value: admin@123
    
    gravitee:
      # Disable all ES reporters
      reporters:
        elasticsearch:
          enabled: false
      
      # Disable analytics
      analytics:
        enabled: false
      
      # Force management repository to JDBC
      management:
        type: jdbc
      
      # Force rate limit to JDBC
      ratelimit:
        type: jdbc
    
    # Gateway-specific JDBC config
    jdbc:
      url: jdbc:postgresql://in-cluster-postgres.postgres.svc.cluster.local:5432/graviteeapim
      driver: https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar
      driverClassName: org.postgresql.Driver
      username: postgres 
      password: admin@123
    
    # Increase readiness probe delays to allow plugin download
    readinessProbe:
      initialDelaySeconds: 90
      periodSeconds: 30
    
    livenessProbe:
      initialDelaySeconds: 150
      periodSeconds: 30

  # UI Configuration
  ui:
    enabled: true

  # Portal Configuration
  portal:
    enabled: true