apim:
  gateway:
    gravitee:
      # 1) Turn OFF the Elasticsearch reporter at runtime
      reporters:
        elasticsearch:
          enabled: false

      # 2) Disable analytics entirely (safest if you’re not using ES)
      analytics:
        enabled: false
  api:
    gravitee:
      reporters:
        elasticsearch:
          enabled: false
      analytics:
        enabled: false
  jdbc:
    url: jdbc:postgresql://in-cluster-postgres.postgres.svc.cluster.local:5432/graviteeapim
    # the URL to download the driver
    driver: https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar
    # the version of the gravitee-repository-jdbc (only required for apim versions < 3.5.0)
  #  repositoryVersion: 3.3.0
    driverClassName: org.postgresql.Driver
    username: postgres 
    password: admin@123
  management:
    type: jdbc
  ratelimit:
    type: jdbc
  es:
    enabled: false
  elasticsearch:
   enabled: false
  #url: your_public_ui_url

  # ratelimit:
  #   type: mongodb