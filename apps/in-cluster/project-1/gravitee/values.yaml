apim:

  global:
    security:
      allowInsecureImages: true
  es:
    enabled: false
  
  elasticsearch:
    enabled: false
    sysctlImage:
      registry: docker.io
      repository: bitnamilegacy/os-shell
      tag: 12-debian-12-r48
    master:
      replicaCount: 1
      heapSize: 512m
      resources:
        limits:
          cpu: 500m
          memory: 2Gi
        requests:
          cpu: 100m
          memory: 512Mi
    
    data:
      replicaCount: 1
      heapSize: 512m
      resources:
        limits:
          cpu: 500m
          memory: 2Gi
        requests:
          cpu: 100m
          memory: 512Mi
    
    coordinating:
      replicaCount: 1
      heapSize: 256m
      resources:
        limits:
          cpu: 500m
          memory: 1Gi
        requests:
          cpu: 50m
          memory: 256Mi
    
    ingest:
      enabled: true
      replicaCount: 1
      heapSize: 256m
      resources:
        limits:
          cpu: 500m
          memory: 1Gi
        requests:
          cpu: 50m
          memory: 256M
    
  
  # JDBC Configuration (global level)
  jdbc:
    url: jdbc:postgresql://in-cluster-postgres.postgres.svc.cluster.local:5432/graviteeapim
    driver: https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar
    driverClassName: org.postgresql.Driver
    username: postgres 
    password: admin@123
  
  # Management & Rate Limit repositories
  management:
    type: jdbc
  
  ratelimit:
    type: jdbc
  
  # API Component Configuration
  api:
    enabled: true

    ingress:
      management:
        enabled: true
        ingressClassName: nginx
        path: /management
        pathType: Prefix
        hosts:
          - api.zahra.local
      portal:
        enabled: true
        ingressClassName: nginx
        path: /portal
        pathType: Prefix
        hosts:
          - api.zahra.local
    # Environment variables to override ES configuration
    env:
      - name: gravitee_management_type
        value: jdbc
      - name: gravitee_ratelimit_type
        value: jdbc
      - name: gravitee_analytics_type
        value: none
      - name: gravitee_reporters_elasticsearch_enabled
        value: "false"
      - name: gravitee_analytics_elasticsearch_enabled
        value: "false"
      - name: gravitee_services_sync_enabled
        value: "false"
      # Explicitly set JDBC properties
      - name: gravitee_management_jdbc_url
        value: jdbc:postgresql://in-cluster-postgres.postgres.svc.cluster.local:5432/graviteeapim
      - name: gravitee_management_jdbc_username
        value: postgres
      - name: gravitee_management_jdbc_password
        value: admin@123
      # Point to the downloaded driver
      - name: gravitee_management_jdbc_driver
        value: /opt/graviteeio-management-api/plugins/ext/repository-jdbc/postgresql-42.7.4.jar
    
    gravitee:
      reporters:
        elasticsearch:
          enabled: false
      analytics:
        enabled: false
      management:
        type: jdbc
      services:
        sync:
          enabled: false
    
    jdbc:
      url: jdbc:postgresql://in-cluster-postgres.postgres.svc.cluster.local:5432/graviteeapim
      driver: https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar
      driverClassName: org.postgresql.Driver
      username: postgres 
      password: admin@123
    
    # Longer delays to ensure JDBC plugin initialization
    readinessProbe:
      initialDelaySeconds: 120
      periodSeconds: 30
      failureThreshold: 5
    
    livenessProbe:
      initialDelaySeconds: 180
      periodSeconds: 30
      failureThreshold: 5
  
  # Gateway Component Configuration
  gateway:
    enabled: true

    ingress:
      ingressClassName: nginx
      hosts: 
        - gateway.zahra.local
    # Environment variables to override ES configuration
    env:
      - name: gravitee_management_type
        value: jdbc
      - name: gravitee_ratelimit_type
        value: jdbc
      - name: gravitee_reporters_elasticsearch_enabled
        value: "false"
      - name: gravitee_analytics_elasticsearch_enabled
        value: "false"
      # Explicitly set JDBC properties for management
      - name: gravitee_management_jdbc_url
        value: jdbc:postgresql://in-cluster-postgres.postgres.svc.cluster.local:5432/graviteeapim
      - name: gravitee_management_jdbc_username
        value: postgres
      - name: gravitee_management_jdbc_password
        value: admin@123
      - name: gravitee_management_jdbc_driver
        value: /opt/graviteeio-gateway/plugins/ext/repository-jdbc/postgresql-42.7.4.jar
      # Explicitly set JDBC properties for rate limiting
      - name: gravitee_ratelimit_jdbc_url
        value: jdbc:postgresql://in-cluster-postgres.postgres.svc.cluster.local:5432/graviteeapim
      - name: gravitee_ratelimit_jdbc_username
        value: postgres
      - name: gravitee_ratelimit_jdbc_password
        value: admin@123
      - name: gravitee_ratelimit_jdbc_driver
        value: /opt/graviteeio-gateway/plugins/ext/repository-jdbc/postgresql-42.7.4.jar
    
    gravitee:
      reporters:
        elasticsearch:
          enabled: false
      analytics:
        enabled: false
      management:
        type: jdbc
      ratelimit:
        type: jdbc
    
    jdbc:
      url: jdbc:postgresql://in-cluster-postgres.postgres.svc.cluster.local:5432/graviteeapim
      driver: https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar
      driverClassName: org.postgresql.Driver
      username: postgres 
      password: admin@123
    
    # Longer delays to ensure JDBC plugin initialization
    readinessProbe:
      initialDelaySeconds: 120
      periodSeconds: 30
      failureThreshold: 5
    
    livenessProbe:
      initialDelaySeconds: 180
      periodSeconds: 30
      failureThreshold: 5

  ui:
    ingress:
      ingressClassName: nginx
      hosts:
       - ui.zahra.local

    enabled: true

  portal:
    ingress:
      ingressClassName: nginx
      hosts:
       - portal.zahra.local
    # ingress:
    #   enabled: false
      
    enabled: true