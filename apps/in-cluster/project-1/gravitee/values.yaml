apim:
  # Global Elasticsearch disable
  es:
    enabled: false
  
  elasticsearch:
    enabled: false
  
  # JDBC Configuration (global level)
  jdbc:
    url: jdbc:postgresql://in-cluster-postgres.postgres.svc.cluster.local:5432/graviteeapim
    driver: https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar
    driverClassName: org.postgresql.Driver
    username: postgres 
    password: admin@123
  
  # Management & Rate Limit repositories
  management:
    type: jdbc
  
  ratelimit:
    type: jdbc
  
  # API Component Configuration
  api:
    enabled: true
    
    gravitee:
      # Disable all ES reporters
      reporters:
        elasticsearch:
          enabled: false
      
      # Disable analytics
      analytics:
        enabled: false
      
      # Force management repository to JDBC
      management:
        type: jdbc
      
      # Explicitly disable ES as a service
      services:
        sync:
          enabled: false
    
    # API-specific JDBC config
    jdbc:
      url: jdbc:postgresql://in-cluster-postgres.postgres.svc.cluster.local:5432/graviteeapim
      driver: https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar
      driverClassName: org.postgresql.Driver
      username: postgres 
      password: admin@123
  
  # Gateway Component Configuration
  gateway:
    enabled: true
    
    gravitee:
      # Disable all ES reporters
      reporters:
        elasticsearch:
          enabled: false
      
      # Disable analytics
      analytics:
        enabled: false
      
      # Force management repository to JDBC
      management:
        type: jdbc
      
      # Force rate limit to JDBC
      ratelimit:
        type: jdbc
    
    # Gateway-specific JDBC config
    jdbc:
      url: jdbc:postgresql://in-cluster-postgres.postgres.svc.cluster.local:5432/graviteeapim
      driver: https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar
      driverClassName: org.postgresql.Driver
      username: postgres 
      password: admin@123
    
    # Increase readiness probe delays to allow plugin download
    readinessProbe:
      initialDelaySeconds: 60
      periodSeconds: 30
    
    livenessProbe:
      initialDelaySeconds: 120
      periodSeconds: 30

  # UI Configuration (optional but recommended)
  ui:
    enabled: true

  # Portal Configuration (optional but recommended)
  portal:
    enabled: true