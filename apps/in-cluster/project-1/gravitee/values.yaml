apim:
  global:
    security:
      allowInsecureImages: true
  
  es:
    enabled: false
  
  elasticsearch:
    enabled: false
  
  # JDBC Configuration
  jdbc:
    url: jdbc:postgresql://in-cluster-postgres.postgres.svc.cluster.local:5432/graviteeapim
    driver: https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar
    driverClassName: org.postgresql.Driver
    username: postgres 
    password: admin@123
  
  management:
    type: jdbc
  
  ratelimit:
    type: jdbc
  
  # API Component
  api:
    enabled: true
    
    service:
      type: ClusterIP
      externalPort: 8083
    
    ingress:
      management:
        enabled: true
        ingressClassName: nginx
        path: /management
        pathType: Prefix
        hosts:
          - api.zahra.local
        annotations:
          nginx.ingress.kubernetes.io/rewrite-target: /management
      
      portal:
        enabled: true
        ingressClassName: nginx
        path: /portal
        pathType: Prefix
        hosts:
          - api.zahra.local
        annotations:
          nginx.ingress.kubernetes.io/rewrite-target: /portal
    
    env:
      - name: gravitee_management_type
        value: jdbc
      - name: gravitee_ratelimit_type
        value: jdbc
      - name: gravitee_analytics_type
        value: none
      - name: gravitee_reporters_elasticsearch_enabled
        value: "false"
      - name: gravitee_analytics_elasticsearch_enabled
        value: "false"
      - name: gravitee_services_sync_enabled
        value: "false"
      - name: gravitee_management_jdbc_url
        value: jdbc:postgresql://in-cluster-postgres.postgres.svc.cluster.local:5432/graviteeapim
      - name: gravitee_management_jdbc_username
        value: postgres
      - name: gravitee_management_jdbc_password
        value: admin@123
      - name: gravitee_management_jdbc_liquibase_enabled
        value: "true"
    
    gravitee:
      reporters:
        elasticsearch:
          enabled: false
      analytics:
        enabled: false
      management:
        type: jdbc
      services:
        sync:
          enabled: false
    
    readinessProbe:
      initialDelaySeconds: 60
      periodSeconds: 30
      failureThreshold: 3
    
    livenessProbe:
      initialDelaySeconds: 120
      periodSeconds: 30
      failureThreshold: 3
  
  # Gateway Component
  gateway:
    enabled: true
    
    service:
      type: ClusterIP
      externalPort: 8082
    
    ingress:
      enabled: true
      ingressClassName: nginx
      path: /
      pathType: Prefix
      hosts:
        - gateway.zahra.local
      annotations:
        nginx.ingress.kubernetes.io/ssl-redirect: "false"
    
    env:
      - name: gravitee_management_type
        value: jdbc
      - name: gravitee_ratelimit_type
        value: jdbc
      - name: gravitee_reporters_elasticsearch_enabled
        value: "false"
      - name: gravitee_analytics_elasticsearch_enabled
        value: "false"
      - name: gravitee_management_jdbc_url
        value: jdbc:postgresql://in-cluster-postgres.postgres.svc.cluster.local:5432/graviteeapim
      - name: gravitee_management_jdbc_username
        value: postgres
      - name: gravitee_management_jdbc_password
        value: admin@123
      - name: gravitee_management_jdbc_liquibase_enabled
        value: "true"
      - name: gravitee_ratelimit_jdbc_url
        value: jdbc:postgresql://in-cluster-postgres.postgres.svc.cluster.local:5432/graviteeapim
      - name: gravitee_ratelimit_jdbc_username
        value: postgres
      - name: gravitee_ratelimit_jdbc_password
        value: admin@123
      - name: gravitee_ratelimit_jdbc_liquibase_enabled
        value: "true"
    
    gravitee:
      reporters:
        elasticsearch:
          enabled: false
      analytics:
        enabled: false
      management:
        type: jdbc
      ratelimit:
        type: jdbc
    
    readinessProbe:
      initialDelaySeconds: 60
      periodSeconds: 30
      failureThreshold: 3
    
    livenessProbe:
      initialDelaySeconds: 120
      periodSeconds: 30
      failureThreshold: 3

  # UI Component
  ui:
    enabled: true
    
    service:
      type: ClusterIP
      externalPort: 8080
    
    ingress:
      enabled: true
      ingressClassName: nginx
      path: /
      pathType: Prefix
      hosts:
        - console.zahra.local
      annotations:
        nginx.ingress.kubernetes.io/ssl-redirect: "false"

  # Portal Component
  portal:
    enabled: true
    
    service:
      type: ClusterIP
      externalPort: 8080
    
    ingress:
      enabled: true
      ingressClassName: nginx
      path: /
      pathType: Prefix
      hosts:
        - portal.zahra.local
      annotations:
        nginx.ingress.kubernetes.io/ssl-redirect: "false"