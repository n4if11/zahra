# promtail-values.yaml
config:
  server:
    log_level: debug
  positions:
    filename: /run/promtail/positions.yaml

  # ──────────────────────────────────────────────────────────────────
  # 1) Define two clients: one for admin, one for dev
  # ──────────────────────────────────────────────────────────────────
  clients:
    - url:  http://loki-gateway.loki.svc.zahra.local/loki/api/v1/push
      tenant_id: 1
    - url:  http://loki-gateway.loki.svc.zahra.local/loki/api/v1/push
      tenant_id: 2

  # ──────────────────────────────────────────────────────────────────
  # 2) Scrape jobs:
  #    • First job: send _all_ namespace logs to client[0] → admin-tenant
  #    • Second job: send only “allowed” namespaces to client[1] → dev-tenant
  # ──────────────────────────────────────────────────────────────────
  scrape_configs:
    # ─────────────── scrape every POD for admin-tenant ───────────────
    - job_name: kubernetes-pods-admin
      kubernetes_sd_configs:
        - role: pod
      relabel_configs:
        # 1) Map pod metadata into labels (namespace, pod, container, etc.)
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
        - source_labels: [__meta_kubernetes_pod_container_name]
          target_label: container

        # 2) Tell Promtail to use client[0] (admin‐tenant) for everything
        - action: replace
          target_label: __client
          replacement: "0"

        # 3) Build the __path__ to each container’s log
        - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_pod_name, __meta_kubernetes_pod_container_name]
          target_label: __path__
          replacement: /var/log/pods/${1}_${2}_*/${3}/*.log

    # ───────── scrape only “dev-allowed” namespaces for dev-tenant ─────────
    - job_name: kubernetes-pods-dev
      kubernetes_sd_configs:
        - role: pod
      relabel_configs:
        # 1) Keep only the namespaces your developers are allowed to see.
        #    Example: allow namespaces “foo” and “bar” (adjust to your case).
        - source_labels: [__meta_kubernetes_namespace]
          action: keep
          regex: '^(loki|monitoring)$'

        # 2) Map metadata into labels
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
        - source_labels: [__meta_kubernetes_pod_container_name]
          target_label: container

        # 3) Tell Promtail to use client[1] (dev-tenant) for these logs
        - action: replace
          target_label: __client
          replacement: "1"

        # 4) Build the __path__
        - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_pod_name, __meta_kubernetes_pod_container_name]
          target_label: __path__
          replacement: /var/log/pods/${1}_${2}_*/${3}/*.log



