apiVersion: v1
kind: Pod
metadata:
  name: test-ceph

spec:

  containers:
  - name: app
    image: busybox
    command: ["sh", "-c", "ls /mnt/data; sleep 3600"]
    volumeMounts:
    - name: data
      mountPath: /mnt/data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: test-pvc
