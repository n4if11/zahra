apiVersion: v1
kind: ConfigMap
metadata:
  name: ncai-gateway-config
  labels:
    {{- include "ncai.labels" . | nindent 4 }}
data:
  APP_NAME: "NCAI Gateway"
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  HOST: "0.0.0.0"
  PORT: "4000"
  WORKERS: {{ .Values.config.workers | quote }}
  SERVE_UI: "true"

  {{- if not .Values.secrets.databaseUrl }}
  POSTGRES_HOST: {{ .Values.postgres.host | quote }}
  POSTGRES_PORT: {{ .Values.postgres.port | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  {{- end }}

  # The migration Job owns schema changes when enabled, so the app must not
  # also try — concurrent `alembic upgrade` from N replicas can deadlock.
  RUN_MIGRATIONS_ON_START: {{ not .Values.migrations.enabled | quote }}

  DEFAULT_MODEL_ACCESS: {{ .Values.config.defaultModelAccess | quote }}
  ALLOW_KEY_SELF_SERVICE: {{ .Values.config.allowKeySelfService | quote }}
  KEY_PREFIX: {{ .Values.config.keyPrefix | quote }}
  REQUEST_TIMEOUT: {{ .Values.config.requestTimeout | quote }}
  ADMIN_EMAIL: {{ .Values.secrets.adminEmail | quote }}

  {{- with .Values.config.corsOrigins }}
  CORS_ORIGINS: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.rootPath }}
  ROOT_PATH: {{ . | quote }}
  {{- end }}

  OIDC_ENABLED: {{ .Values.oidc.enabled | quote }}
  {{- if .Values.oidc.enabled }}
  OIDC_ISSUER: {{ .Values.oidc.issuer | quote }}
  OIDC_CLIENT_ID: {{ .Values.oidc.clientId | quote }}
  OIDC_PROVIDER_NAME: {{ .Values.oidc.providerName | quote }}
  OIDC_SCOPES: {{ .Values.oidc.scopes | quote }}
  OIDC_GROUPS_CLAIM: {{ .Values.oidc.groupsClaim | quote }}
  OIDC_DEFAULT_ROLE: {{ .Values.oidc.defaultRole | quote }}
  OIDC_AUTO_PROVISION: {{ .Values.oidc.autoProvision | quote }}
  {{- with .Values.oidc.redirectUrl }}
  OIDC_REDIRECT_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.oidc.adminGroups }}
  OIDC_ADMIN_GROUPS: {{ . | quote }}
  {{- end }}
  {{- end }}
