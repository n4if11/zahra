{{- if not .Values.secrets.existingSecret }}
{{- if not .Values.secrets.masterKey }}
{{- fail "secrets.masterKey is required. Generate one with: openssl rand -hex 32" }}
{{- end }}
{{- if not .Values.secrets.jwtSecret }}
{{- fail "secrets.jwtSecret is required. Generate one with: openssl rand -hex 32" }}
{{- end }}
{{- if not .Values.secrets.saltKey }}
{{- fail "secrets.saltKey is required. Generate one with: openssl rand -hex 32. Changing it later makes stored provider keys unreadable." }}
{{- end }}
{{- if and (not .Values.secrets.databaseUrl) (not .Values.postgres.host) }}
{{- fail "Set either secrets.databaseUrl or postgres.host — the gateway needs a Postgres to start." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: ncai-gateway-secrets
  labels:
    {{- include "ncai.labels" . | nindent 4 }}
type: Opaque
stringData:
  MASTER_KEY: {{ .Values.secrets.masterKey | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  SALT_KEY: {{ .Values.secrets.saltKey | quote }}
  {{- if .Values.secrets.databaseUrl }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.adminPassword }}
  ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
  {{- end }}
  {{- if .Values.config.redisUrl }}
  {{/* Set from config.redisUrl but stored here: the URL embeds a password.
       With secrets.existingSecret, supply REDIS_URL in that secret too. */}}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  {{- end }}
  {{- if .Values.oidc.enabled }}
  OIDC_CLIENT_SECRET: {{ .Values.secrets.oidcClientSecret | quote }}
  {{- end }}
{{- end }}
