apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  destinations:
  - namespace: '*'
    server: https://kubernetes.default.svc
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
  sourceRepos:
  - '*'
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: monitoring
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=default"]
  generators:
    - git:
        repoURL: https://github.com/n4if11/zahra
        revision: HEAD
        requeueAfterSeconds: 20
        files:
          - path: "apps/monitoring/**/config.yaml"
        values:
          name: "{{.path.basename}}"
  template:
    metadata:
      name: '{{ default .values.name .appName }}'
      namespace: argocd
      labels:
        app.kubernetes.io/name: '{{.values.name}}'
    spec:
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ default .values.name .destNamespace }}'
      project: monitoring
      source:
        repoURL: '{{ default "https://github.com/n4if11/zahra" .repoURL }}'
        targetRevision: '{{ default "HEAD" .srcTargetRevision }}'
        path: '{{ default .path.path .srcPath }}'
      syncPolicy:
        automated:
          allowEmpty: true
          prune: true
          selfHeal: true
        retry:
          limit: 30
          backoff:
            duration: 20s
            factor: 1
            maxDuration: 20s
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
  templatePatch: |
    {{- if .noAutoSync }}
    spec:
      syncPolicy:
        automated: null
        retry:
          limit: 30
          backoff:
            duration: 20s
            factor: 1
            maxDuration: 20s
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
    {{- end }}
  syncPolicy: {}
