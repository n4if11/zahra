# Helm values for n8n
# Reference: https://artifacthub.io/packages/helm/n8n/n8n

extraEnvSecrets:
  N8N_ENCRYPTION_KEY:
    name: n8n-secrets
    key: N8N_ENCRYPTION_KEY
  CLAUDE_API_KEY:
    name: n8n-secrets
    key: CLAUDE_API_KEY

config:
  database:
    type: sqlite

persistence:
  enabled: true
  size: 1Gi
