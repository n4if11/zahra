apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-secrets
  namespace: n8n
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: n8n-secrets
    creationPolicy: Owner
    template:
      data:
        secret.json: |
          {"encryption_key":"{{ "{{" }} .encryptionKey {{ "}}" }}"}
  data:
    - secretKey: encryptionKey
      remoteRef:
        key: project-1/n8n
        property: encryptionKey
